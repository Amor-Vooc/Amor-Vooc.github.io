<script>
    function viewer_init() {
        let pswpElement = document.querySelectorAll('.pswp')[0];
        let $imgArr = document.querySelectorAll(('.article-entry img:not(.reward-img)'))

        $imgArr.forEach(($em, i) => {
            $em.onclick = () => {
                // slider展开状态
                // todo: 这样不好，后面改成状态
                if (document.querySelector('.left-col.show')) return
                let items = []
                $imgArr.forEach(($em2, i2) => {
                    let img = $em2.getAttribute('data-idx', i2)
                    let src = $em2.getAttribute('data-target') || $em2.getAttribute('src')
                    let title = $em2.getAttribute('alt')
                    // 获得原图尺寸
                    const image = new Image()
                    image.src = src
                    items.push({
                        src: src,
                        w: image.width || $em2.width,
                        h: image.height || $em2.height,
                        title: title
                    })
                })
                var gallery = new PhotoSwipe(pswpElement, PhotoSwipeUI_Default, items, {
                    index: parseInt(i)
                });
                window.ayerImageViewer = gallery;
                gallery.listen('destroy', function () {
                    if (window.ayerImageViewer === gallery) window.ayerImageViewer = null;
                });
                gallery.init()
            }
        })
    }
    viewer_init()
</script>

<script src="https://cdn.jsdelivr.net/npm/clipboard@2/dist/clipboard.min.js"></script>
<script>
  (function () {
    var clipboard;
    window.ayerInitClipboard = function () {
      document.querySelectorAll('.highlight .code pre, .article pre code').forEach(function (code) {
        if (code.previousElementSibling && code.previousElementSibling.classList.contains('btn-copy')) return;
        var button = document.createElement('button');
        button.className = 'btn-copy';
        button.type = 'button';
        button.setAttribute('aria-label', '复制代码');
        button.innerHTML = '<i class="ri-file-copy-2-line"></i><span>COPY</span>';
        code.before(button);
      });
      // ClipboardJS delegates clicks, so one instance survives every page change.
      if (clipboard || !window.ClipboardJS) return;
      clipboard = new ClipboardJS('.btn-copy', {
        target: function (trigger) { return trigger.nextElementSibling; }
      });
      function feedback(event, success) {
        var button = event.trigger;
        button.classList.toggle('copied', success);
        button.querySelector('span').textContent = success ? 'COPIED' : 'COPY FAILED';
        button.querySelector('i').className = success ? 'ri-checkbox-circle-line' : 'ri-time-line';
        if (event.clearSelection) event.clearSelection();
        setTimeout(function () {
          button.classList.remove('copied');
          button.querySelector('span').textContent = 'COPY';
          button.querySelector('i').className = 'ri-file-copy-2-line';
        }, 2000);
      }
      clipboard.on('success', function (event) { feedback(event, true); });
      clipboard.on('error', function (event) { feedback(event, false); });
    };
    window.ayerInitClipboard();
  })();
</script>
